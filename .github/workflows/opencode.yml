name: Opencode AI Code Review

on:
  pull_request:
    branches: [main]

jobs:
  review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install opencode
        run: npm install -g opencode

      - name: Install dependencies
        run: npm ci

      - name: Generate code
        run: |
          npm run generated-api-type || true
          npm run generated-service || true
          npm run generated-factory || true
          npm run index-generated || true

      - name: Run review-agent
        id: review
        run: |
          output=$(npx opencode /review-agent review src/ 2>&1)
          echo "$output" > $GITHUB_WORKSPACE/review-output.txt
          {
            echo 'output<<EOF'
            echo "$output"
            echo 'EOF'
          } >> $GITHUB_OUTPUT

      - name: Post review comment
        uses: actions/github-script@v7
        if: always()
        with:
          script: |
            const fs = require('fs');
            const output = fs.readFileSync(process.env.GITHUB_WORKSPACE + '/review-output.txt', 'utf8');
            const body = '## AI Code Review\n\n' + output.substring(0, 15000) + '\n\n---\n*@review-agent*';
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              body: body
            });

      - name: Check for critical issues
        run: |
          if grep -qi "error\|failed\|critical" $GITHUB_WORKSPACE/review-output.txt; then
            echo "found_issues=true" >> $GITHUB_OUTPUT
          else
            echo "found_issues=false" >> $GITHUB_OUTPUT
          fi

      - name: Fail on critical issues
        if: steps.review.outputs.found_issues == 'true'
        run: echo "Critical issues found" && exit 1
